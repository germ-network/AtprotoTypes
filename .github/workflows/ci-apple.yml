name: Apple

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test Swift ${{ matrix.swift }} ${{ matrix.destination }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app
    strategy:
      fail-fast: false
      matrix:
        swift:
          - '6.3'
          - '6.4'
        destination:
          - 'platform=macOS'
          - 'platform=macOS,variant=Mac Catalyst'
          - 'platform=iOS Simulator,name=iPhone 17e'
          - 'platform=iOS Simulator,name=iPhone Air'
          # - "platform=tvOS Simulator,name=Apple TV"
          # - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
          # - "platform=visionOS Simulator,name=Apple Vision Pro"
        include:
          # Xcode 26.6 ships Swift 6.3, the floor in Package.swift.
          - swift: '6.3'
            runner: macos-26
            xcode: '26.6'
          # Swift 6.4 needs Xcode 27, which GitHub only has on the `xcode-27`
          # image. That image is still a preview, so expect occasional
          # queueing or image churn there.
          - swift: '6.4'
            runner: xcode-27
            xcode: '27.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test platform ${{ matrix.destination }}
        # -skipPackagePluginValidation: swift-secp256k1 (the differential-test
        # oracle for AtprotoTypesVerify's from-scratch k256, test-only and never
        # shipped) carries a build-tool plugin that copies its shared sources.
        # xcodebuild refuses unvalidated plugins non-interactively; `swift test`
        # doesn't gate them, which is why Linux stayed green while Apple failed.
        run: set -o pipefail && xcodebuild -skipMacroValidation -skipPackagePluginValidation -scheme AtprotoTypes -destination "$DESTINATION" test | xcbeautify
        env:
          DESTINATION: ${{ matrix.destination }}
