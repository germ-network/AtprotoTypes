name: Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - ".editorconfig"
      - ".spi.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-android:
    name: Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: "Test Swift Package on Android"
        uses: skiptools/swift-android-action@v2
        with:
          # Full patch version on purpose: the action derives the download URL
          # from it, and swift.org has no bare `swift-6.4-RELEASE` directory.
          # 6.4 is also the first release with an Ubuntu 26.04 host toolchain,
          # which `ubuntu-latest` became in November 2026; 6.3 only 404s there.
          swift-version: "6.4.2"
          # 6.4 defaults `swift build` to the Swift Build engine, which on this
          # target never writes `AtprotoTypes_AtprotoTypesVerifyTests.resources`
          # into the products folder (the action's `cp *.resources` step found
          # nothing to copy), so `Bundle.module` trapped on the emulator the
          # moment a test loaded a PLC or Wycheproof vector. The deprecated
          # native engine still lays the bundle out where the action expects it.
          swift-build-flags: "--build-system native"
          # The emulator, not the tests, is what fails here: seen twice as
          # `adb: device offline` right after "Successfully loaded snapshot",
          # and as the adb daemon dying mid-run (exit 137) — never as a failing
          # assertion. `-no-snapshot` takes the snapshot save/restore step out
          # of the picture at the cost of a slower boot, and the extra memory
          # gives the AVD headroom now that the test binary statically links
          # libsecp256k1. Reclaiming disk first keeps the Swift toolchain and
          # Android SDK from crowding the emulator's own image out.
          android-emulator-options: "-no-window -noaudio -no-boot-anim -no-snapshot -memory 4096"
          free-disk-space: "true"
